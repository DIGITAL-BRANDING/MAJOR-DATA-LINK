<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This app has its own light gold/cream/bronze theme (see src/index.css).
         Without this, some Android browsers (Chrome's "Force Dark" / auto
         dark theme for sites without one) heuristically re-color the whole
         page, turning the light backgrounds and blue/white cards into an
         illegible dark-brown mush. Declaring an explicit light-only scheme
         tells the browser this page already has a considered color scheme,
         so it leaves our colors alone. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#15100A" />
    <meta name="description" content="K-TECH SOLUTIONS is a reliable enterprise verification platform, API provider and VTU services partner, delivering secure identity verification, seamless API integration, airtime, data and digital payment solutions." />
    <title>K-TECH SOLUTIONS — Enterprise Verification, APIs &amp; VTU Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tawk.to live support widget. Loaded once at the application shell so
         it remains available on every public and signed-in route. -->
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      (function () {
        var s1 = document.createElement('script'), s0 = document.getElementsByTagName('script')[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/6aae3fec9387e034445258f5/1k2sajdc0';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        s0.parentNode.insertBefore(s1, s0);
      })();
    </script>
  </body>
</html>
